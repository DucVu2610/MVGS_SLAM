inherit_from: configs/ReplicaMultiagent/apart_0.yaml
config_path: configs/ReplicaMultiagent/apart_0_gaussian_landmark_loop035.yaml

loop_detection:
  feature_extractor_name: dino
  weights_path: facebook/dinov2-small
  embed_size: 384
  # Apart-0 loop threshold from the parameter study; this is not a
  # held-out/generalization default and must not be copied into the base config.
  feature_dist_threshold: 0.35
  max_loops_per_frame: 1
  fitness_threshold: 0.35
  inlier_rmse_threshold: 0.10
  dino_patch_preserve_aspect_ratio: true
  dino_patch_short_edge: 280
  dino_use_fast: false

submap:
  registration_method: gaussian_landmark
  fallback_to_fpfh: false
  initial_transformation_unknown: true
  registration_options:
    min_correspondences: 8
    min_ransac_inliers: 3
    ransac_distance_threshold: 0.05
    max_keypoints: 4096
    ratio_threshold: 0.8
    dino_min_similarity: -1.0
    dino_min_margin: 0.0
    dino_keep_top_fraction: 1.0
    dino_depth_window_radius: 2
    dino_depth_max_mad_m: 0.05
    dino_compatibility_threshold_m: 0.03
    dino_min_compatibility_support: 16
    gaussian_min_opacity: 0.05
    gaussian_depth_tolerance_m: 0.05
    gaussian_max_landmarks: 2048
    gaussian_refit_inliers: true

keyframing:
  patch_level_check: true
  patch_novel_fraction_threshold: 0.08
